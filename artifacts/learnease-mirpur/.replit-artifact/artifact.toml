kind = "web"
previewPath = "/"
title = "LearnEase Mirpur"
version = "1.0.0"
id = "artifacts/learnease-mirpur"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21373

[services.development]
run = "pnpm --filter @workspace/learnease-mirpur run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/learnease-mirpur", "run", "build" ]
serve = "static"
publicDir = "artifacts/learnease-mirpur/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21373"
BASE_PATH = "/"
